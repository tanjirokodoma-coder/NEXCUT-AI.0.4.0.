                  hero.addView(text("\u2726  VIDEO EDITING LAB", 11f, cyan, true))
                  hero.addView(text("\u0641\u0643\u0631\u062A\u0643\u060C \u062B\u0645\n\u0645\u0648\u0646\u062A\u0627\u062C \u0641\u0639\u0644\u064A.", 29f, Color.WHITE, true).apply { setPadding(0, dp(12), 0, dp(8)) })
                  hero.addView(text("\u0623\u0648\u0627\u0645\u0631 \u0639\u0631\u0628\u064A\u0629 \u0628\u0633\u064A\u0637\u0629 \u062A\u062A\u062D\u0648\u0644 \u0625\u0644\u0649 \u0641\u0644\u0627\u062A\u0631 \u0641\u0639\u0644\u064A\u0629 \u0648\u062A\u0635\u062F\u064A\u0631 \u0641\u064A\u062F\u064A\u0648. \u0644\u0627 \u0646\u0636\u064A\u0641 \u0645\u0648\u0633\u064A\u0642\u0649 \u062A\u0644\u0642\u0627\u0626\u064A\u064B\u0627.", 14f, Color.rgb(218, 216, 230), false))
                  layout.addView(hero, marginTop(22))

                  layout.addView(text("1 \u00B7 \u0627\u062E\u062A\u0631 \u0641\u064A\u062F\u064A\u0648", 20f, Color.WHITE, true), marginTop(24))
                  layout.addView(text("\u0627\u062E\u062A\u0631 \u0645\u0642\u0637\u0639\u064B\u0627 \u0645\u0646 \u0647\u0627\u062A\u0641\u0643 \u0644\u062A\u0637\u0628\u064A\u0642 \u062A\u0639\u062F\u064A\u0644\u0627\u062A \u0639\u0644\u064A\u0647.", 13f, muted, false), marginTop(5))
                  val choose = button("\u0627\u062E\u062A\u064A\u0627\u0631 \u0641\u064A\u062F\u064A\u0648", purple)
                  choose.setOnClickListener { pickVideo() }
                  layout.addView(choose, marginTop(12))

                  status = text("\u0644\u0645 \u064A\u062A\u0645 \u0627\u062E\u062A\u064A\u0627\u0631 \u0641\u064A\u062F\u064A\u0648 \u0628\u0639\u062F", 13f, muted, false).apply {
                      setPadding(dp(14), dp(13), dp(14), dp(13)); background = rounded(panel, 14)
                  }
                  layout.addView(status, marginTop(10))

                  layout.addView(text("\u0642\u0635\u0651 \u0627\u0644\u0641\u064A\u062F\u064A\u0648 (\u0627\u062E\u062A\u064A\u0627\u0631\u064A)", 18f, Color.WHITE, true), marginTop(20))
                  layout.addView(text("\u0623\u062F\u062E\u0644 \u0627\u0644\u0648\u0642\u062A \u0628\u0627\u0644\u062B\u0648\u0627\u0646\u064A. \u0627\u062A\u0631\u0643 \u0627\u0644\u0646\u0647\u0627\u064A\u0629 \u0641\u0627\u0631\u063A\u0629 \u0644\u0644\u0627\u062D\u062A\u0641\u0627\u0638 \u0628\u0628\u0642\u064A\u0629 \u0627\u0644\u0641\u064A\u062F\u064A\u0648.", 12f, muted, false), marginTop(5))
                  val trimRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  trimStartInput = EditText(this).apply {
                      hint = "\u0627\u0644\u0628\u062F\u0627\u064A\u0629: 0 \u062B\u0627\u0646\u064A\u0629"; setHintTextColor(muted); setTextColor(Color.WHITE); textSize = 13f
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER or android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL
                      setPadding(dp(10), dp(10), dp(10), dp(10)); background = rounded(Color.rgb(39, 41, 52), 12)
                  }
                  trimEndInput = EditText(this).apply {
                      hint = "\u0627\u0644\u0646\u0647\u0627\u064A\u0629: \u0627\u062E\u062A\u064A\u0627\u0631\u064A"; setHintTextColor(muted); setTextColor(Color.WHITE); textSize = 13f
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER or android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL
                      setPadding(dp(10), dp(10), dp(10), dp(10)); background = rounded(Color.rgb(39, 41, 52), 12)
                  }
                  trimRow.addView(trimStartInput, LinearLayout.LayoutParams(0, dp(52), 1f))
                  trimRow.addView(View(this), LinearLayout.LayoutParams(dp(8), 1))
                  trimRow.addView(trimEndInput, LinearLayout.LayoutParams(0, dp(52), 1f))
                  layout.addView(trimRow, marginTop(10))

                  layout.addView(text("2 \u00B7 \u0627\u062E\u062A\u0631 \u0623\u0633\u0644\u0648\u0628\u064B\u0627", 20f, Color.WHITE, true), marginTop(24))
                  val styleGrid = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val row1 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row1.addView(styleButton("\u0637\u0628\u064A\u0639\u064A", Style.NATURAL), LinearLayout.LayoutParams(0, dp(48), 1f))
                  row1.addView(View(this), LinearLayout.LayoutParams(dp(8), 1))
                  row1.addView(styleButton("\u0633\u064A\u0646\u0645\u0627\u0626\u064A", Style.CINEMATIC), LinearLayout.LayoutParams(0, dp(48), 1f))
                  val row2 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row2.addView(styleButton("\u0628\u0627\u0631\u062F", Style.COOL), LinearLayout.LayoutParams(0, dp(48), 1f))
                  row2.addView(View(this), LinearLayout.LayoutParams(dp(8), 1))
                  row2.addView(styleButton("\u062F\u0627\u0641\u0626", Style.WARM), LinearLayout.LayoutParams(0, dp(48), 1f))
                  val row3 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row3.addView(styleButton("\u062A\u0641\u062A\u064A\u062D", Style.BRIGHT), LinearLayout.LayoutParams(0, dp(48), 1f))
                  row3.addView(View(this), LinearLayout.LayoutParams(dp(8), 1))
                  row3.addView(styleButton("\u0623\u0628\u064A\u0636 \u0648\u0623\u0633\u0648\u062F", Style.MONO), LinearLayout.LayoutParams(0, dp(48), 1f))
                  styleGrid.addView(row1); styleGrid.addView(row2, marginTop(8)); styleGrid.addView(row3, marginTop(8))
                  layout.addView(styleGrid, marginTop(12))

                  layout.addView(text("3 \u00B7 \u0623\u0648 \u0627\u0643\u062A\u0628 \u0637\u0644\u0628\u0643", 20f, Color.WHITE, true), marginTop(24))
                  prompt = EditText(this).apply {
                      hint = "\u0645\u062B\u0627\u0644: \u062E\u0644\u0651\u064A \u0627\u0644\u0641\u064A\u062F\u064A\u0648 \u0633\u064A\u0646\u0645\u0627\u0626\u064A\u060C \u0623\u0648 \u0627\u0641\u062A\u062D \u0627\u0644\u0625\u0636\u0627\u0621\u0629 \u0634\u0648\u064A..."
                      setHintTextColor(muted); setTextColor(Color.WHITE); textSize = 14f; minLines = 3
                      gravity = Gravity.TOP; setPadding(dp(13), dp(12), dp(13), dp(12)); background = rounded(Color.rgb(39, 41, 52), 13)
                  }
                  layout.addView(prompt, marginTop(10))
                  val interpret = button("\u0641\u0647\u0645 \u0627\u0644\u0623\u0645\u0631 \u0648\u062A\u062D\u062F\u064A\u062F \u0627\u0644\u062A\u0639\u062F\u064A\u0644", Color.rgb(55, 48, 78))
                  interpret.setOnClickListener { interpretPrompt() }
                  layout.addView(interpret, marginTop(10))

                  val planText = text("\u0627\u0644\u062A\u0639\u062F\u064A\u0644 \u0627\u0644\u062D\u0627\u0644\u064A: \u0637\u0628\u064A\u0639\u064A \u2014 \u0644\u0645 \u064A\u062A\u0645 \u0627\u0644\u062A\u0635\u062F\u064A\u0631 \u0628\u0639\u062F", 13f, cyan, false).apply {
                      setPadding(dp(13), dp(12), dp(13), dp(12)); background = rounded(panel, 12)
                  }
                  planStatus = planText
