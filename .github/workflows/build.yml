name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          cat > build.gradle.kts <<'EOF_NEX'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF_NEX
          cat > settings.gradle.kts <<'EOF_NEX'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NEXCUT AI"
          include(":app")
          EOF_NEX
          cat > gradle.properties <<'EOF_NEX'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_NEX
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_NEX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.nexcut.ai"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.nexcut.ai"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 4
                  versionName = "0.4.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.media3:media3-common:1.5.1")
              implementation("androidx.media3:media3-transformer:1.5.1")
              implementation("androidx.media3:media3-effect:1.5.1")
          }
          EOF_NEX
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_NEX'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:allowBackup="true"
                  android:label="NEXCUT AI"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_NEX
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'EOF_NEX'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="nexcut_icon_background">#0F0C1F</color>
          </resources>
          EOF_NEX
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/nexcut_icon_foreground.xml <<'EOF_NEX'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#995BFF" android:pathData="M27,24 L51,36 L51,51 L27,64 Z"/>
              <path android:fillColor="#30E7FF" android:pathData="M47,29 L81,54 L47,79 L54,54 Z"/>
              <path android:fillColor="#140E26" android:pathData="M50,43 L63,54 L50,65 Z"/>
              <path android:fillColor="#D2BEFF" android:pathData="M22,21 L34,21 L34,24 L25,24 L25,33 L22,33 Z"/>
              <path android:fillColor="#57F5FF" android:pathData="M74,75 L86,75 L86,78 L77,78 L77,87 L74,87 Z"/>
          </vector>
          EOF_NEX
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_NEX'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/nexcut_icon_background"/>
              <foreground android:drawable="@drawable/nexcut_icon_foreground"/>
          </adaptive-icon>
          EOF_NEX
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF_NEX'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/nexcut_icon_background"/>
              <foreground android:drawable="@drawable/nexcut_icon_foreground"/>
          </adaptive-icon>
          EOF_NEX
          mkdir -p app/src/main/java/com/nexcut/ai
          cat > app/src/main/java/com/nexcut/ai/MainActivity.kt <<'EOF_NEX'
